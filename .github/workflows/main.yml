name: Bundle and Publish Sources
on:
  push:
    branches:
      - 'main'
      - '0.8'
permissions:
  contents: write
  pages: write
jobs:
  build:
    name: Bundle and Publish Sources
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Create output directory
        shell: bash
        run: mkdir -p bundles

      - run: npm install

      - name: Run bundle
        shell: bash
        run: npm run bundle -- --folder=${{ steps.extract_branch.outputs.branch }}

      - name: Create index.js for each source
        shell: bash
        run: |
          for dir in ./bundles/${{ steps.extract_branch.outputs.branch }}/*/; do
            if [ -f "${dir}source.js" ]; then
              cp "${dir}source.js" "${dir}index.js"
              echo "Created ${dir}index.js"
            fi
          done

      - name: Fix repo name case in index.html
        shell: bash
        run: |
          REPO_NAME="${{ github.repository }}"
          CORRECT_NAME="${REPO_NAME#*/}"
          LOWERCASE_NAME=$(echo "$CORRECT_NAME" | tr '[:upper:]' '[:lower:]')
          INDEX_FILE="./bundles/${{ steps.extract_branch.outputs.branch }}/index.html"
          if [ "$CORRECT_NAME" != "$LOWERCASE_NAME" ]; then
            sed -i "s/$LOWERCASE_NAME/$CORRECT_NAME/g" "$INDEX_FILE"
            echo "Fixed case: $LOWERCASE_NAME -> $CORRECT_NAME in $INDEX_FILE"
          else
            echo "No case difference needed"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bundles
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Enable GitHub Pages (try create, then update)
        shell: bash
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          if [ "$STATUS" = "409" ]; then
            echo "Pages already enabled, updating config..."
            curl -L -X PUT \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
          fi
